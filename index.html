  :root {
    --bg: #000; --ink: #fff; --dim: rgba(255, 255, 255, .5); --faint: rgba(255, 255, 255, .22);
    --line: #52525b; --red: #ff3b30; --green: #22c55e;
    --u: 56px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  /* Departure Mono is a pixel font: crisp at 11px and its multiples. CJK falls back to system fonts. */
  body { font: 11px/1.75 "IYX Mono", Consolas, "Microsoft YaHei", "Meiryo", monospace; text-transform: uppercase;
    -webkit-font-smoothing: none; overflow-x: hidden; }
  #app { padding: 14px 16px 150px; width: 1560px; transform-origin: 0 0; }
  ::selection { background: var(--ink); color: var(--bg); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; }
  .dim { color: var(--dim); }
  .red { color: var(--red); }
  .line { white-space: pre; }
  .gap { height: 12px; }
  .nav:focus { outline: none; }

  /* film grain over everything */
  .grain { position: fixed; inset: -100%; width: 300%; height: 300%; pointer-events: none; opacity: .025; z-index: 40;
    animation: grain 8s steps(10) infinite; }
  @keyframes grain { 0%, 100% { transform: translate(-15%, -20%); } 10% { transform: translate(-5%, -10%); }
    20% { transform: translate(-15%, -5%); } 30% { transform: translate(-5%, -25%); } 40% { transform: translate(-10%, -10%); }
    50% { transform: translate(-20%, -15%); } 60% { transform: translate(-5%, -20%); } 70% { transform: translate(-15%, -10%); }
    80% { transform: translate(-25%, -15%); } 90% { transform: translate(-10%, -5%); } }

  /* loader */
  .boot { position: fixed; inset: 0; background: #000; display: grid; place-content: center; gap: 6px; z-index: 50;
    text-align: center; transition: opacity .35s; }
  .boot.out { opacity: 0; }
  .boot .step { text-align: left; }
  .boot .bar { width: 266px; height: 28px; border: 1px solid var(--ink); padding: 3px; display: flex; gap: 3px; }
  .boot .bar i { width: 9.5px; background: var(--ink); }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* intro */
  .booting .intro, .booting .fade, .booting #banner { opacity: 0; animation: none; }
  .intro { animation: slideIn .45s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .fade { animation: fadeIn .5s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  pre.banner { margin: 0 0 12px; font: 11px/1.0 "IYX Mono", Consolas, monospace; letter-spacing: 0; }

  .opt { display: block; width: fit-content; white-space: pre; cursor: pointer; }
  .opt:focus, .opt.nav:focus { background: var(--ink); color: var(--bg); }
  .opt:focus .dim, .opt:focus .red { color: var(--bg); }
  .tab { padding: 0 3px; margin-right: 15px; }
  .tab.on { outline: 1px solid var(--ink); }
  .tab:focus { background: var(--ink); color: var(--bg); }
  .btn { display: inline-block; min-width: 106px; text-align: center; border: 1px solid var(--ink); padding: 0 8px; line-height: 1.3; }
  .btn:hover, .btn:focus, .opt:focus .btn { background: var(--ink); color: var(--bg); outline: none; }
  .opt:focus .btn { outline: 1px solid var(--bg); outline-offset: -2px; }
  .btn.solid { background: var(--ink); color: var(--bg); }
  .btn.small { min-width: 0; }
  .val { display: inline-block; min-width: 11ch; text-align: center; }
  .chip { display: inline-block; min-width: 3ch; padding: 0 4px; margin: 0 6px 6px 0; border: 1px solid transparent; cursor: pointer; }
  .chip:hover, .chip:focus { border-color: var(--ink); }
  .grid-toggle { display: inline-block; width: 30px; text-align: center; cursor: pointer; }
  .grid-toggle:focus { background: var(--ink); color: var(--bg); }
  .swatch { display: inline-block; width: 30px; height: 12px; border: 1px solid var(--ink); vertical-align: -2px; margin-right: 4px; }
  .swatch:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
  input[type=color] { width: 34px; height: 16px; padding: 0; border: 1px solid var(--ink); background: none; vertical-align: -3px; cursor: pointer; }

  .layout { display: grid; grid-template-columns: 560px auto; gap: 24px; align-items: start; margin-top: 14px; }
  .panel { padding-left: 26px; }
  .tabs { margin: 0 0 22px 26px; white-space: nowrap; }
  .subtabs { margin: 0 0 16px; }
  .rows { padding-left: 26px; }

  .kbhead { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 26px; width: calc(16 * var(--u) + 40px); padding-left: 40px; }
  .kbhead .acts { display: flex; gap: 18px; }
  .kbcase { position: relative; margin-left: 40px; }
  #kbArea.hidden { display: none; }
  .kbcase svg { position: absolute; overflow: visible; pointer-events: none; }
  /* stroke width is set from JS in photo units so it renders as 1px; the dash drawing needs normal (scaling) strokes */
  .kbcase svg .edge { fill: none; stroke: var(--ink); }
  .kbcase svg .soft { fill: none; stroke: var(--line); }
  .kbcase.drawing svg .edge, .kbcase.drawing svg .soft { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4, 0, .2, 1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .caselogo { position: absolute; margin: 0 -.2em 0 0; font: 22px/1 "IYX Mono", Consolas, monospace; letter-spacing: .2em;
    white-space: pre; pointer-events: none; }
  .kbcase.drawing .caselogo { animation: fadeIn .4s 1.1s ease both; }
  /* leaving: keys fade out right to left, then the outline un-draws */
  #kbArea.leaving .kbhead, #kbArea.leaving .kbfoot, #kbArea.leaving .caselogo { animation: fadeOut .3s ease both; }
  #kbArea.leaving .key { animation: fadeOut .25s ease both; animation-delay: calc((16 - var(--kx)) * .018s); }
  #kbArea.leaving svg .edge, #kbArea.leaving svg .soft { stroke-dasharray: 1 1; animation: undraw .7s .3s cubic-bezier(.4, 0, .2, 1) both; }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes undraw { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1; } }
  .kb { position: relative; width: calc(16 * var(--u) + 1px); height: calc(5 * var(--u) + 1px); }
  .key { position: absolute; border: 1px solid var(--line); margin: -1px 0 0 -1px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1.3; cursor: pointer; user-select: none; overflow: hidden; }
  .kbcase.drawing .key { animation: fadeIn .35s ease both; animation-delay: calc(1s + var(--kx) * .025s); }
  .key:focus { outline: 1px dashed var(--ink); outline-offset: -4px; }
  .key .k-l, .key .k-v { position: relative; white-space: nowrap; }
  .key .k-v { color: var(--dim); }
  .key.custom .k-v { color: var(--ink); }
  .key .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255, 255, 255, .28); pointer-events: none; }
  .key.hit .fill { background: rgba(255, 59, 48, .45); }
  .key .tint { position: absolute; inset: 0; opacity: .55; pointer-events: none; }
  .key.sel { outline: 1px solid var(--ink); outline-offset: -1px; z-index: 2; background: rgba(255, 255, 255, .12); }
  .key:hover { background: rgba(255, 255, 255, .06); }
  .key.off .k-l { color: var(--faint); }
  .key.done { background: rgba(255, 255, 255, .85); color: #000; }
  .key.done .k-v { color: #000; }
  .kbfoot { margin: 52px 0 0 40px; color: var(--dim); }

  textarea { width: 100%; height: 70px; background: #000; color: var(--ink); border: 1px solid var(--line);
    font: 11px/1.4 Consolas, monospace; padding: 6px; resize: vertical; text-transform: none; }

  /* footer: help box + languages + status share one baseline, like a terminal status bar */
  footer { position: fixed; left: 0; bottom: 0; display: flex; align-items: flex-end; gap: 26px; padding: 0 0 10px 14px;
    transform-origin: 0 100%; z-index: 30; white-space: nowrap; }
  .help { width: 262px; border: 1px solid var(--ink); background: #000; text-transform: none; }
  .help header { display: flex; justify-content: space-between; padding: 2px 6px; text-transform: uppercase; cursor: pointer; }
  .help header:focus { background: var(--ink); color: var(--bg); }
  .help .body { padding: 8px 6px 10px; min-height: 96px; border-top: 1px solid var(--ink);
    font: 12px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", "Meiryo", sans-serif; -webkit-font-smoothing: auto; }
  .help .body b { display: block; margin-bottom: 4px; }
  .help.closed .body { display: none; }
  .langs { display: flex; gap: 10px; padding-bottom: 2px; }
  .langs button { color: var(--dim); }
  .langs button.on { color: var(--ink); }
  .langs button:focus { background: var(--ink); color: var(--bg); }
  .status { color: var(--dim); padding-bottom: 2px; }
</style>
</head>
<body class="booting">
<div class="grain" id="grain"></div>
<div id="app">
  <pre class="banner" id="banner"></pre>
  <div class="line intro" id="hdrVersion" style="animation-delay:.55s"></div>
  <div class="gap"></div>
  <div class="line intro" id="hdrHint" style="animation-delay:.65s"></div>
  <div class="gap"></div>
  <div id="devices" class="panel intro" style="animation-delay:.75s"></div>

  <div class="layout">
    <div class="intro" style="animation-delay:.9s">
      <div class="tabs" id="tabs"></div>
      <div id="view"></div>
    </div>
    <div id="kbArea" class="hidden">
      <div class="kbhead fade" style="animation-delay:.9s"><span id="prompt"></span><span class="acts" id="kbActs"></span></div>
      <div class="kbcase" id="kbcase"><svg id="caseSvg"></svg><div class="kb" id="kb"></div></div>
      <div class="kbfoot fade" id="kbfoot" style="animation-delay:2.2s"></div>
    </div>
  </div>
</div>

<footer id="footer">
  <section class="help closed" id="help">
    <header id="helpToggle" class="nav" tabindex="0"><span id="helpTitle">HELP</span><span id="helpCaret">^</span></header>
    <div class="body" id="helpBody"></div>

/* ===================== protocol (docs/PROTOCOL.md) ===================== */
const VID = 0x0416, PID = 0x7372, USAGE_PAGE = 0xFF1B, USAGE = 0x91;
const CMD = { LIGHT: 0x07, CUSTOM: 0x09, INFO: 0x0D, RESET: 0x14, KEYMAP: 0x18, MACRO: 0x19, HE: 0x21, ADV: 0x22 };
const HE = { SET_RT_OFF: 0x00, WATCH: 0x02, READ_KEY: 0x05, CALIBRATE: 0x08, POLLING: 0x09, SET_RT_ON: 0x0D };
const KEYTYPE_RT = 0x0D;
const SLOT_ADV = 0x17;              // keymap slot type: advanced key, code = advanced-table index
const ADV = { DKS: 1, MT: 2, TGL: 3 };  // the only advanced types this firmware supports (6 froze it)
const POLLING = [1, 2, 4, 8];

const hePacket = (sub, payload = []) => [0x01, CMD.HE, 0, 0, 0, 0x18, sub, ...payload];
function keyMask(ids) {  // 17 bytes, one per column, bit = row
  const m = new Array(17).fill(0);
  for (const id of ids) m[id & 0xFF] |= 1 << (id >> 8);
  return m;
}
const slotIndex = (id) => (id >> 8) * 22 + (id & 0xFF);
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

// Full key-table write, in the vendor app's order: keymap (both layers), advanced table, macro table.
function buildKeyTables(model) {
  const base = new Array(132).fill(null).map(() => [0, 0, 0, 0]);
  const fn = new Array(132).fill(null).map(() => [0, 0, 0, 0]);
  for (const [id, code] of Object.entries({ ...DEFAULT_BASE, ...model.map.base })) base[slotIndex(+id)] = [0, code, 0, 0];
  for (const [id, code] of Object.entries({ ...DEFAULT_FN, ...model.map.fn })) fn[slotIndex(+id)] = [0, code, 0, 0];
  const adv = [];
  model.adv.forEach((a, i) => {
    base[slotIndex(a.key)] = [SLOT_ADV, i, 0, 0];
    if (a.type === ADV.DKS) {
      const page = [ADV.DKS, ...a.travel];
      for (const b of a.binds) page.push(0, b.code, 0, 0, ...b.on.map(Number));
      adv.push(page);
    } else if (a.type === ADV.MT) {
      adv.push([ADV.MT, 0, a.tap, 0, 0, 0, a.hold, 0, 0, a.time]);
    } else if (a.type === ADV.TGL) {
      adv.push([ADV.TGL, 0, a.code]);
    }
  });
  const pkts = [];
  [[0, base], [2, fn]].forEach(([layer, slots]) => {
    const flat = slots.flat();
    for (let c = 0; c < 10; c++) {
      const len = c < 9 ? 0x38 : 0x18;
      pkts.push([0x01, CMD.KEYMAP, layer, 0, c, len, ...flat.slice(c * 0x38, c * 0x38 + len)]);
    }
  });
  for (let p = 0; p < 40; p++) pkts.push([0x01, CMD.ADV, p, 0, 0, 0x32, ...(adv[p] || [])]);
  for (let m = 0; m < 10; m++) for (let c = 0; c < 5; c++) pkts.push([0x01, CMD.MACRO, m, 0, c, c < 4 ? 0x3A : 0x18]);
  return pkts;
}

class Mu68 {
  constructor(device) {
    this.dev = device;
    this.name = "IYX MU68";
    this.reportId = 1;
    this.waiter = null;
    this.chain = Promise.resolve();
    this.onTravel = null;
    this.onCalib = null;
    this.handler = (e) => this.onInput(e);
    device.addEventListener("inputreport", this.handler);
  }
  async open() {
    if (!this.dev.opened) await this.dev.open();
    const out = this.dev.collections.flatMap((c) => c.outputReports || []);
    if (out.length) this.reportId = out[0].reportId;
  }
  async close() {
    this.dev.removeEventListener("inputreport", this.handler);
    if (this.dev.opened) await this.dev.close();
  }
  onInput(e) {
    const b = [e.reportId, ...new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength)];
    if (b[1] === CMD.HE && b[5] === 0x03 && b[6] === 0x01) { this.onTravel?.((b[7] << 8) | b[8], b[9]); return; }
    if (this.waiter && this.waiter.match(b)) { this.waiter.got(b); return; }
    if (b[1] === CMD.HE && b[5] === 0x18 && b[6] === HE.CALIBRATE) this.onCalib?.(b[7], b.slice(8, 25));
  }
  // Replies carry no request id, so requests are strictly serialized. match=null: fire and forget.
  request(pkt, match, { timeout = 400, count = 1 } = {}) {
    const run = async () => {
      const replies = [];
      const done = match ? new Promise((resolve) => {
        const timer = setTimeout(resolve, timeout);
        this.waiter = { match, got: (b) => { replies.push(b); if (replies.length >= count) { clearTimeout(timer); resolve(); } } };
      }) : null;
      const data = new Uint8Array(63);
      data.set(pkt.slice(1, 64));
      await this.dev.sendReport(this.reportId, data);
      if (done) await done; else await new Promise((r) => setTimeout(r, 4));
      this.waiter = null;
      return replies;
    };
    const p = this.chain.then(run, run);
    this.chain = p.catch(() => {});
    return p;
  }
  async info() {
    const r = await this.request([0x01, CMD.INFO], (b) => b[1] === CMD.INFO, { timeout: 600, count: 2 });
    const text = {};
    for (const b of r) {
      const bytes = b.slice(6, 6 + b[5]);
      const end = bytes.indexOf(0);
      text[b[4]] = String.fromCharCode(...bytes.slice(0, end < 0 ? bytes.length : end));
    }
    return { ident: text[0] || "", build: text[1] || "" };
  }
  async getPolling() {
    const [b] = await this.request(hePacket(HE.POLLING), (b) => b[1] === CMD.HE && b[5] === 2 && b[6] === HE.POLLING);
    return b ? b[7] : null;
  }
  async setPolling(khz) {
    if (!POLLING.includes(khz)) throw new Error("unsupported polling rate");
    const [b] = await this.request(hePacket(HE.POLLING, [0x01, khz]), (b) => b[1] === CMD.HE && b[5] === 2 && b[6] === HE.POLLING);
    return b ? b[7] : null;
  }
  async readKey(id) {
    const [b] = await this.request(hePacket(HE.READ_KEY, [id >> 8, id & 0xFF]),
      (b) => b[1] === CMD.HE && b[5] === 4 && b[6] === HE.READ_KEY, { timeout: 200 });
    return b ? { rt: b[7] === KEYTYPE_RT, press: b[8], p: b[10], r: b[11] } : null;
  }
  async setKeys(ids, { press, rt, p, r }) {  // distances in 0.1 mm units (1..40)
    const body = new Array(57).fill(0);  // payload bytes [7..63]
    keyMask(ids).forEach((v, i) => (body[i] = v));
    body[22] = press; body[23] = press;
    if (rt) { body[24] = p; body[25] = r; }
    const [ack] = await this.request(hePacket(rt ? HE.SET_RT_ON : HE.SET_RT_OFF, body), (b) => b[1] === CMD.HE && b[5] === 1);
    return !!ack;
  }
  async watch(ids) {
    await this.request(ids.length ? hePacket(HE.WATCH, keyMask(ids)) : hePacket(HE.WATCH), (b) => b[1] === CMD.HE && b[5] === 1);
  }
  async resetSystem() {
    const [b] = await this.request([0x01, CMD.RESET, 0, 0, 0, 0x01, 0x01], (b) => b[1] === CMD.RESET, { timeout: 1000 });
    return !!b;
  }
  async writeKeyTables(model) {
    let missing = 0;
    const pkts = buildKeyTables(model);
    for (let i = 0; i < pkts.length; i++) {
      if (i === 20 || i === 60) await new Promise((r) => setTimeout(r, 400));  // vendor pauses between tables
      const cmd = pkts[i][1];
      const [ack] = await this.request(pkts[i], (b) => b[1] === cmd, { timeout: 300 });
      if (!ack) missing++;
    }
    return missing === 0;
  }
  async setLighting(l) {
    const [r, g, b] = hexToRgb(l.color), [br, bg, bb] = hexToRgb(l.bg);
    if (l.mode === MODE_CUSTOM) {
      const rgb = new Array(432).fill(0);
      for (const [id, hex] of Object.entries(l.custom)) rgb.splice(slotIndex(+id) * 3, 3, ...hexToRgb(hex));
      for (let c = 0; c < 8; c++) await this.request([0x01, CMD.CUSTOM, 0, 0, c, 0x36, ...rgb.slice(c * 54, c * 54 + 54)], null);
      await this.request([0x01, CMD.LIGHT, 0, 0, 0, 0x0E, MODE_CUSTOM, l.bright, l.speed], null);
      return;
    }
    await this.request([0x01, CMD.LIGHT, 0, 0, 0, 0x0E, l.mode, l.bright, l.speed, r, g, b, br, bg, bb, l.dir, l.rainbow ? 1 : 0], null);
  }
  // Calibration start and finish are the same command; progress arrives through onCalib.
  async calibrate() {
    const [b] = await this.request(hePacket(HE.CALIBRATE, [0x01]), (b) => b[1] === CMD.HE && b[5] === 0x18 && b[6] === HE.CALIBRATE, { timeout: 800 });
    return b ? b[7] : null;
  }
}

// In-memory stand-in so every page can be explored without a keyboard.
class DemoMu68 {
  constructor() {
    this.name = "IYX MU68 (DEMO)";
    this.demo = true;
    this.cfg = new Map(KEYS.map((k) => [k.id, { rt: false, press: 20, p: 5, r: 5 }]));
    this.polling = 8;
    this.watching = false;
    this.calibrating = null;
    this.down = (e) => this.press(e, true);
    this.up = (e) => this.press(e, false);
    addEventListener("keydown", this.down);
    addEventListener("keyup", this.up);
  }
  press(e, isDown) {
    const k = KEY_BY_CODE.get(e.code);
    if (!k || e.repeat) return;
    if (this.calibrating && isDown) {
      this.calibrating.add(k.id);
      this.onCalib?.(1, keyMask([...this.calibrating]));
    }
    if (!this.watching) return;
    let depth = isDown ? 0 : 40;
    clearInterval(k._t);
    k._t = setInterval(() => {
      depth += isDown ? 6 : -8;
      if (depth >= 40 || depth <= 0) { depth = Math.max(0, Math.min(40, depth)); clearInterval(k._t); }
      this.onTravel?.(k.id, depth);
    }, 16);
  }
  async open() {}
  async close() { removeEventListener("keydown", this.down); removeEventListener("keyup", this.up); }
  async info() { return { ident: "M484,20,KB,DEMO,GK8152HERGB,V1_11_12", build: "DEMO BUILD" }; }
  async getPolling() { return this.polling; }
  async setPolling(k) { this.polling = k; return k; }
  async readKey(id) { await new Promise((r) => setTimeout(r, 4)); return { ...this.cfg.get(id) }; }
  async setKeys(ids, c) { for (const id of ids) this.cfg.set(id, { ...c }); return true; }
  async watch(ids) { this.watching = ids.length > 0; }
  async resetSystem() { this.polling = 8; return true; }
  async writeKeyTables() { await new Promise((r) => setTimeout(r, 150)); return true; }
  async setLighting() {}
  async calibrate() {
    if (this.calibrating) { this.calibrating = null; setTimeout(() => this.onCalib?.(0, new Array(17).fill(0)), 300); return 4; }
    this.calibrating = new Set();
    return 1;
  }
}

/* ===================== state ===================== */
const S = {
  dev: null, info: null, polling: null,
  board: new Map(),      // id -> {rt, press, p, r} as last read from the keyboard
  model: null,           // see defaultModel()
  tab: "act", sub: "general", layer: "base", cat: "cat.chars",
  selecting: new Set(),
  live: true,
  step: 1,
  confirmReset: false,
  paired: [],
  editAdv: null,         // {type, key|null, draft, pickSlot}
  pickFor: null,         // callback receiving a HID code from the picker
  calib: null,           // {done:Set}
  paint: "#ffffff",
  status: ["st.ready", {}],
};
const defaultLight = () => ({ mode: 2, bright: 4, speed: 2, color: "#ffffff", bg: "#000000", rainbow: true, dir: 0, custom: {} });
const defaultModel = () => ({
  act: { global: 20, sets: [] },
  rt: { global: { on: false, p: 5, r: 5 }, sets: [] },
  sep: false,
  map: { base: {}, fn: {} },
  adv: [],
  light: defaultLight(),
});
const PROFILE_KEY = "iyx68.profiles";
function loadProfiles() {
  try { const p = JSON.parse(localStorage.getItem(PROFILE_KEY)); if (p?.list?.length === 4) return p; } catch {}
  return { cur: 0, list: [null, null, null, null] };
}
const saveProfiles = (p) => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch {} };
let PROFILES = loadProfiles();

const $ = (id) => document.getElementById(id);
const mm = (v) => (v / 10).toFixed(2) + " MM";
const clamp = (v, lo = 1, hi = 40) => Math.max(lo, Math.min(hi, v));
const STEPS = [1, 2, 5, 10];  // value step for < > in 0.1 mm units
const step = (v, d) => clamp(v + d * S.step);
const clone = (o) => JSON.parse(JSON.stringify(o));
const rtKey = (c) => (c.rt ? `1,${c.p},${c.r}` : "0");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function mode(values) {
  const n = new Map();
  for (const v of values) n.set(v, (n.get(v) || 0) + 1);
  return [...n.entries()].sort((a, b) => b[1] - a[1])[0][0];
}
// Status is stored as a translation key so it follows language changes.
function status(key, vars = {}) { S.status = [key, vars]; $("statusLine").textContent = "> " + t(key, vars); }

/* ===================== actuation model <-> board ===================== */
function deriveActuation(board) {
  const ids = KEYS.map((k) => k.id);
  const gPress = mode(ids.map((id) => board.get(id).press));
  const actSets = new Map();
  for (const id of ids) {
    const v = board.get(id).press;
    if (v !== gPress) (actSets.get(v) || actSets.set(v, []).get(v)).push(id);
  }
  const gRt = mode(ids.map((id) => rtKey(board.get(id))));
  const rtSets = new Map();
  for (const id of ids) {
    const k = rtKey(board.get(id));
    if (k !== gRt) (rtSets.get(k) || rtSets.set(k, []).get(k)).push(id);
  }
  const parseRt = (k) => { const [on, p, r] = k.split(",").map(Number); return { on: !!on, p: p || 5, r: r || 5 }; };
  return {
    act: { global: gPress, sets: [...actSets].map(([v, keys]) => ({ keys, v })) },
    rt: { global: parseRt(gRt), sets: [...rtSets].map(([k, keys]) => ({ keys, ...parseRt(k) })) },
    sep: [...board.values()].some((c) => c.rt && c.p !== c.r),
  };
}

function effective(id) {
  const m = S.model;
  const a = m.act.sets.find((s) => s.keys.includes(id));
  const r = m.rt.sets.find((s) => s.keys.includes(id)) || m.rt.global;
  return { press: a ? a.v : m.act.global, rt: r.on, p: r.p, r: m.sep ? r.r : r.p };
}

const timers = {};
function debounce(name, fn, ms = 350) { clearTimeout(timers[name]); timers[name] = setTimeout(fn, ms); }
function changed(...what) {
  persistModel();
  render();
  if (what.includes("act")) debounce("act", syncActuation);
  if (what.includes("keys")) debounce("keys", syncKeyTables, 500);
  if (what.includes("light")) debounce("light", syncLighting, 250);
}

let busy = Promise.resolve();
const exclusive = (fn) => (busy = busy.then(fn, fn));

const syncActuation = () => exclusive(async () => {
  if (!S.dev) return;
  const groups = new Map();
  for (const k of KEYS) {
    const e = effective(k.id);
    const b = S.board.get(k.id);
    if (b && b.press === e.press && b.rt === e.rt && (!e.rt || (b.p === e.p && b.r === e.r))) continue;
    const key = `${e.press},${e.rt},${e.p},${e.r}`;
    (groups.get(key) || groups.set(key, { cfg: e, ids: [] }).get(key)).ids.push(k.id);
  }
  if (!groups.size) return;
  status("st.writingAct");
  let ok = true;
  for (const { cfg, ids } of groups.values()) {
    ok = (await S.dev.setKeys(ids, cfg)) && ok;
    for (const id of ids) S.board.set(id, await S.dev.readKey(id));
  }
  render();
  status(ok ? "st.saved" : "st.notConfirmed");
});
const syncKeyTables = () => exclusive(async () => {
  if (!S.dev) return;
  status("st.writingMap");
  const ok = await S.dev.writeKeyTables(S.model);
  status(ok ? "st.mapSaved" : "st.mapNotConfirmed");
});
const syncLighting = () => exclusive(async () => {
  if (!S.dev) return;
  await S.dev.setLighting(S.model.light);
  status("st.lightSent");
});

function persistModel() {
  PROFILES.list[PROFILES.cur] = clone(S.model);
  saveProfiles(PROFILES);
}

/* ===================== devices ===================== */
const isMu68 = (d) => d.vendorId === VID && d.productId === PID && d.collections.some((c) => c.usagePage === USAGE_PAGE);
async function refreshPaired() {
  S.paired = "hid" in navigator ? (await navigator.hid.getDevices()).filter(isMu68) : [];
}

// The keyboard and its case only appear once a keyboard is connected and read; each appearance replays the draw-in.
function syncKeyboardVisibility() {
  const area = $("kbArea");
  const want = !!(S.dev && S.model) && !document.body.classList.contains("booting");
  if (!want) {
    if (area.classList.contains("hidden") || area.classList.contains("leaving")) return;
    // play the exit, then hide; a reconnect during the exit cancels it
    area.classList.add("leaving");
    $("kbcase").classList.remove("drawing");
    clearTimeout(S.leaveTimer);
    S.leaveTimer = setTimeout(() => { area.classList.remove("leaving"); area.classList.add("hidden"); }, 1050);
    return;
  }
  if (area.classList.contains("leaving")) {
    clearTimeout(S.leaveTimer);
    area.classList.remove("leaving");
    area.classList.add("hidden");
  }
  if (!area.classList.contains("hidden")) return;
  area.classList.remove("hidden");
  for (const n of area.querySelectorAll(".fade")) { n.classList.remove("fade"); void n.offsetWidth; n.classList.add("fade"); }
  const kbcase = $("kbcase");
  kbcase.classList.remove("drawing");
  void kbcase.offsetWidth;  // restart the animations
  kbcase.classList.add("drawing");
  const lastKey = KEYS.reduce((a, k) => (k.x > a.x ? k : a)).el;
  lastKey.addEventListener("animationend", () => kbcase.classList.remove("drawing"), { once: true });
}

// onProgress(0..1) is used by the loader while the 68 keys are read.
async function connect(dev, onProgress) {
  if (S.dev) await disconnect();
  try { await dev.open(); } catch (err) { status("st.connectFail", { e: err.message.toUpperCase() }); return false; }
  S.dev = dev;
  S.model = null;
  status("st.reading");
  render();
  S.info = await dev.info();
  S.polling = await dev.getPolling();
  S.board.clear();
  for (let i = 0; i < KEYS.length; i++) {
    S.board.set(KEYS[i].id, (await dev.readKey(KEYS[i].id)) || { rt: false, press: 20, p: 5, r: 5 });
    onProgress?.((i + 1) / KEYS.length);
  }
  // Actuation comes from the keyboard; keymap and lighting cannot be read back, so they come from the stored profile.
  const stored = PROFILES.list[PROFILES.cur];
  S.model = { ...defaultModel(), ...(stored || {}), ...deriveActuation(S.board) };
  S.model.light = { ...defaultLight(), ...S.model.light };
  persistModel();
  dev.onTravel = onTravel;
  dev.onCalib = onCalib;
  if (S.live) await dev.watch(KEYS.map((k) => k.id));
  status("st.connected", { n: KEYS.length });
  render();
  return true;
}

async function disconnect() {
  const dev = S.dev;
  if (!dev) return;
  S.dev = null;
  S.calib = null;
  try { if (S.live) await dev.watch([]); } catch {}
  await dev.close().catch(() => {});
  status("st.disconnected");
  render();
}

async function pair() {
  if (!("hid" in navigator)) { status("st.noHid"); return; }
  try {
    const devs = await navigator.hid.requestDevice({ filters: [{ vendorId: VID, productId: PID, usagePage: USAGE_PAGE, usage: USAGE }] });
    await refreshPaired();
    if (devs[0]) await connect(new Mu68(devs[0]));
  } catch { status("st.pairCancel"); }
  render();
}

/* ===================== small UI builders ===================== */
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === "help") e.dataset.help = v;
    else if (k === "value") e.value = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
// Every keyboard-reachable control has class "nav". `step` handles left/right; `activate` handles enter/space.
function nav(node, { step, activate } = {}) {
  node.classList.add("nav");
  node.tabIndex = 0;
  if (step) node._step = step;
  if (activate) node._activate = activate;
  return node;
}
// Width of a string in terminal cells (CJK glyphs take two).
const cells = (s) => [...s].reduce((n, ch) => n + (/[⺀-￯]/.test(ch) ? 2 : 1), 0);
const dots = (label, width = 34) => label + ".".repeat(Math.max(2, width - cells(label)));

// "LABEL........ < VALUE >" row; arrows, clicks on < > or on the row change it
function stepRow(label, value, onStep, help, width = 34) {
  const row = el("div", { class: "opt", help, on: { click: (e) => { if (e.target === row || e.target.classList.contains("val")) onStep(1); } } });
  row.append(dots(label, width) + " ",
    el("button", { class: "dim", tabindex: -1, on: { click: () => onStep(-1) } }, "<"),
    el("span", { class: "val" }, value),
    el("button", { class: "dim", tabindex: -1, on: { click: () => onStep(1) } }, ">"));
  return nav(row, { step: onStep, activate: () => onStep(1) });
}
function buttonRow(label, text, onClick, help, { solid = false, width = 34 } = {}) {
  return nav(el("div", { class: "opt", help }, dots(label, width) + " ",
    el("button", { class: "btn" + (solid ? " solid" : ""), tabindex: -1, on: { click: onClick } }, text)), { activate: onClick });
}
const textRow = (s, cls = "dim") => el("div", { class: cls, style: "white-space:pre" }, s);
const spacer = () => el("div", { class: "gap" });
const cycle = (list, cur, d) => list[(list.indexOf(cur) + d + list.length) % list.length];
const onOff = (v) => (v ? t("on") : t("off"));
// A horizontal group of tabs: left/right moves and activates.
function tabGroup(items, current, onPick, cls = "tabs") {
  const box = el("div", { class: cls });
  items.forEach(([id, label, help], i) => {
    const b = el("button", { class: "tab" + (current === id ? " on" : ""), help, "data-tab": id, on: { click: () => onPick(id) } }, label);
    nav(b, { step: (d) => {
      const next = items[(i + d + items.length) % items.length][0];
      onPick(next);
      document.querySelector(`[data-tab="${CSS.escape(next)}"]`)?.focus();  // the group was re-rendered
    } });
    box.append(b);
  });
  return box;
}

/* ===================== header ===================== */
// IYX logo: the word is rendered with a heavy system font and sampled into a grid of "0" characters.
function renderBanner() {
  const rows = 17, cellH = 10, cellW = cellH * 6.6 / 11;   // Departure Mono cell is ~6.6 x 11 px
  const c = document.createElement("canvas");
  const g = c.getContext("2d");
  const font = `900 ${rows * cellH * 1.32}px "Arial Black", Impact, sans-serif`;
  g.font = font;
  const w = Math.ceil(g.measureText("IYX").width) + 4;
  c.width = w; c.height = rows * cellH;
  g.font = font;
  g.textBaseline = "alphabetic";
  g.fillStyle = "#fff";
  g.fillText("IYX", 2, rows * cellH * 0.985);
  const px = g.getImageData(0, 0, c.width, c.height).data;
  const cols = Math.ceil(w / cellW);
  const lines = [];
  for (let r = 0; r < rows; r++) {
    let line = "";
    for (let x = 0; x < cols; x++) {
      const sx = Math.min(c.width - 1, Math.floor((x + 0.5) * cellW)), sy = Math.floor((r + 0.5) * cellH);
      line += px[(sy * c.width + sx) * 4 + 3] > 110 ? "0" : " ";
    }
    lines.push(line.replace(/\s+$/, ""));
  }
  S.logo = lines;
  $("banner").textContent = lines.join("\n");
}

// Intro: logo rows resolve from noise into the final characters.
async function animateBanner() {
  const glyphs = "01#%&/\\<>*";
  const start = performance.now(), dur = 900;
  await new Promise((done) => {
    const frame = (now) => {
      const p = Math.min(1, (now - start) / dur);
      $("banner").textContent = S.logo.map((line, r) => {
        const settle = (r / S.logo.length) * 0.6 + 0.35;
        return [...line].map((ch) => (ch === " " ? " " : p >= settle || Math.random() < p * 0.6 ? ch : glyphs[(Math.random() * glyphs.length) | 0])).join("");
      }).join("\n");
      if (p < 1) requestAnimationFrame(frame); else done();
    };
    requestAnimationFrame(frame);
  });
  $("banner").textContent = S.logo.join("\n");
}

function renderDevices() {
  const box = $("devices");
  box.replaceChildren();
  if (S.dev) {
    const fw = S.info ? fwVersion(S.info.ident) : "";
    box.append(el("div", { class: "line" },
      nav(el("button", { class: "opt", style: "display:inline", help: t("h.disconnect"), on: { click: disconnect } }, "[X]"), { activate: disconnect }),
      " ", el("span", { style: "color:var(--green)" }, "◆"), ` ${S.dev.name}${fw ? " - V" + fw : ""}`));
    box.append(nav(el("div", { class: "opt", help: t("h.profile") },
      t("profile") + " ", el("button", { class: "dim", tabindex: -1, on: { click: () => switchProfile(-1) } }, "<"),
      " ", el("span", { class: "red" }, "■"), ` ${PROFILES.cur + 1} `,
      el("button", { class: "dim", tabindex: -1, on: { click: () => switchProfile(1) } }, ">")), { step: switchProfile, activate: () => switchProfile(1) }));
    return;
  }
  if (S.paired.length) {
    box.append(textRow(t("dev.found"), ""));

      box.append(nav(el("div", { class: "opt", help: t("h.connect"), on: { click: go } }, `  ◇ IYX MU68 #${i + 1}   [${t("dev.connect")}]`), { activate: go }));
    });
  } else {
    box.append(textRow(t("dev.none")));
  }
  box.append(nav(el("div", { class: "opt", help: t("h.pair"), on: { click: pair } }, "  " + t("dev.pair")), { activate: pair }));
  const demo = () => connect(new DemoMu68());
  box.append(nav(el("div", { class: "opt", help: t("h.demo"), on: { click: demo } }, "  " + t("dev.demo")), { activate: demo }));
}
const fwVersion = (ident) => (ident.split(",")[5] || "").replace(/^V/, "").replaceAll("_", ".");

const TABS = ["act", "rt", "map", "light", "switch", "adv"];
function renderTabs() {
  const box = tabGroup(TABS.map((id) => [id, t("tab." + id), t("h.tab." + id)]), S.tab, (id) => {
    if (S.calib) return;
    S.tab = id; S.selecting.clear(); S.pickFor = null; S.editAdv = null; render();
  });

/* ===================== pages ===================== */
function setLabel(ids) {
  const s = ids.map((id) => KEY_BY_ID.get(id).label).join(",");
  return s.length > 20 ? s.slice(0, 18) + ".." : s;
}
function removeKeysFrom(sets, ids) {
  for (const s of sets) s.keys = s.keys.filter((k) => !ids.includes(k));
  return sets.filter((s) => s.keys.length);
}
function withRemove(row, onRemove) {
  row.firstChild.textContent = row.firstChild.textContent.slice(4);
  row.prepend(el("button", { class: "dim", tabindex: -1, on: { click: onRemove } }, "[X] "));
  row.addEventListener("keydown", (e) => { if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); onRemove(); } });
  return row;
}

function renderView() {
  const rows = el("div", { class: "rows" });
  $("view").replaceChildren(rows);
  if (!S.dev) { rows.append(textRow(t("view.connect"))); return; }
  if (!S.model) { rows.append(textRow(t("kb.reading"))); return; }
  ({ act: pageActuation, rt: pageRapid, map: pageMapping, light: pageLighting, switch: pageSwitches, adv: pageAdvanced })[S.tab](rows);
}

function stepSizeRow() {
  const label = t("step");
  const row = stepRow(`"MM" ${label}`, mm(S.step), (d) => {
    S.step = STEPS[clamp(STEPS.indexOf(S.step) + d, 0, STEPS.length - 1)];
    render();
  }, t("h.step"));
  row.firstChild.replaceWith("\"", el("span", { class: "red" }, "MM"), row.firstChild.textContent.slice(3));
  return row;
}

function pageActuation(rows) {
  const m = S.model;
  rows.append(stepRow(t("act.global"), mm(m.act.global), (d) => { m.act.global = step(m.act.global, d); changed("act"); }, t("h.act.global")));
  rows.append(stepSizeRow(), spacer());
  for (const s of m.act.sets) {
    rows.append(withRemove(stepRow("    " + setLabel(s.keys), mm(s.v), (d) => { s.v = step(s.v, d); changed("act"); }, t("h.keyset")), () => {
      m.act.sets = m.act.sets.filter((x) => x !== s); changed("act");
    }));
  }
  rows.append(textRow(t("keyset.hint")));
}

function pageRapid(rows) {
  const m = S.model, g = m.rt.global;
  rows.append(stepRow(t("rt.global"), onOff(g.on), () => { g.on = !g.on; changed("act"); }, t("h.rt.global")));
  rows.append(stepRow(t("rt.sep"), onOff(m.sep), () => { m.sep = !m.sep; changed("act"); }, t("h.rt.sep")));
  sensRows(rows, g, "  ");
  rows.append(stepSizeRow(), spacer());
  for (const s of m.rt.sets) {
    rows.append(withRemove(stepRow("    " + setLabel(s.keys), onOff(s.on), () => { s.on = !s.on; changed("act"); }, t("h.keyset")), () => {
      m.rt.sets = m.rt.sets.filter((x) => x !== s); changed("act");
    }));
    sensRows(rows, s, "    ");
  }
  rows.append(textRow(t("keyset.hint")));
}

function sensRows(rows, s, indent) {
  if (!s.on) return;
  if (S.model.sep) {
    rows.append(stepRow(indent + t("rt.press"), mm(s.p), (d) => { s.p = step(s.p, d); changed("act"); }, t("h.rt.press")));
    rows.append(stepRow(indent + t("rt.release"), mm(s.r), (d) => { s.r = step(s.r, d); changed("act"); }, t("h.rt.release")));
  } else {
    rows.append(stepRow(indent + t("rt.sens"), mm(s.p), (d) => { s.p = s.r = step(s.p, d); changed("act"); }, t("h.rt.sens")));
  }
}

// Output picker (category tabs + chips). S.pickFor receives the chosen HID code.
function picker(rows) {
  rows.append(tabGroup(HID_CATS.map((c) => [c, t(c)]), S.cat, (c) => { S.cat = c; render(); }, "subtabs"));
  const box = el("div", { class: "chipbox", style: "max-width:500px" });
  const chips = HID.filter((x) => x.cat === S.cat);
  chips.forEach((h, i) => {
    const pick = () => S.pickFor?.(h.code);
    box.append(nav(el("span", { class: "chip", help: t("h.hid", { k: h.label, c: "0x" + h.code.toString(16).toUpperCase() }), on: { click: pick } }, h.label),
      { activate: pick, step: (d) => box.children[clamp(i + d, 0, chips.length - 1)]?.focus() }));
  });
  rows.append(box);
}

function mappedCode(id, layer = S.layer) {
  if (layer === "base" && S.model.adv.find((a) => a.key === id)) return null;
  const over = S.model.map[layer][id];
  return over ?? (layer === "base" ? DEFAULT_BASE : DEFAULT_FN)[id] ?? 0;
}

function pageMapping(rows) {
  rows.append(tabGroup([["base", t("map.base"), t("h.map.base")], ["fn", t("map.fn"), t("h.map.fn")]], S.layer,
    (id) => { S.layer = id; S.selecting.clear(); render(); }, "subtabs"));
  const sel = [...S.selecting];
  if (!sel.length) {
    rows.append(textRow(t("map.selectKeys")), spacer(), textRow(t("map.noread")));
    return;
  }
  rows.append(textRow(t("map.pickFor", { k: setLabel(sel) }), ""), spacer());
  S.pickFor = (code) => {
    for (const id of sel) {
      const def = (S.layer === "base" ? DEFAULT_BASE : DEFAULT_FN)[id] ?? 0;
      if (code === def) delete S.model.map[S.layer][id]; else S.model.map[S.layer][id] = code;
    }

/* ===================== keyboard + case ===================== */
function buildKeyboard() {
  const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--u"));
  const s = (16 * u) / CASE.openingW;   // screen px per photo px
  const W = 16 * u, H = 5 * u;          // key grid; the case is drawn around it in screen px
  const mm = u / CASE.keyPitchMm;      // screen px per real mm (one key = 19.05 mm)
  const b = CASE.sideMm * mm, h = CASE.handle;
  // keys share 1px borders: the grid's visible edges are at -1 (left/top), W (right) and H - 1 (bottom border line)
  // The 10 mm front ramp holds the IYX logo centred, taking about half of its height (as on the real case).
  // logo at 22px (2x the terminal font, still pixel-crisp): 16px cap height, 2px offset inside its line box
  const LOGO_INK = 16, LOGO_INK_OFFSET = 2;
  const L = -1 - b, R = W + b, T = -1 - b, rampY = H - 1 + b, B = rampY + CASE.rampMm * mm, HL = L - h.out * s;
  const rt = CASE.rTop * s, rb = CASE.rBottom * s;
  const p = (x, y) => `${x.toFixed(2)},${y.toFixed(2)}`;
  const outline = `M${p(HL, T + rt)} Q${p(HL, T)} ${p(HL + rt, T)} L${p(R - rt, T)} Q${p(R, T)} ${p(R, T + rt)} ` +
    `L${p(R, B - rb)} Q${p(R, B)} ${p(R - rb, B)} L${p(L + rb, B)} Q${p(L, B)} ${p(L, B - rb)} L${p(L, T + h.chamferEnd * s)} ` +
    [...h.taper].reverse().map(([x, y]) => `L${p(HL + x * s, T + y * s)}`).join(" ") + ` L${p(HL, T + h.straight * s)} Z`;
  const sx = HL + h.slot.x * s, sw = h.slot.w * s, sy = T + h.slot.y * s, sh = h.slot.h * s, sr = sw / 2;
  const slot = `M${p(sx, sy + sr)} Q${p(sx, sy)} ${p(sx + sr, sy)} Q${p(sx + sw, sy)} ${p(sx + sw, sy + sr)} ` +
    `L${p(sx + sw, sy + sh - sr)} Q${p(sx + sw, sy + sh)} ${p(sx + sr, sy + sh)} Q${p(sx, sy + sh)} ${p(sx, sy + sh - sr)} Z`;

  const svg = $("caseSvg");
  const pad = 2;
  svg.setAttribute("viewBox", `${HL - pad} ${T - pad} ${R - HL + 2 * pad} ${B - T + 2 * pad}`);
  svg.setAttribute("width", R - HL + 2 * pad);
  svg.setAttribute("height", B - T + 2 * pad);
  svg.style.left = HL - pad + "px";
  svg.style.top = T - pad + "px";
  const NS = "http://www.w3.org/2000/svg";
  const path = (d, cls) => {
    const node = document.createElementNS(NS, "path");
    node.setAttribute("d", d); node.setAttribute("class", cls); node.setAttribute("pathLength", "1"); node.setAttribute("stroke-width", 1);
    svg.append(node);
  };
  path(outline, "edge");
  path(slot, "edge");
  path(`M${p(L, rampY)} L${p(R, rampY)}`, "soft");

  // Carved logo in terminal text, right edge where the real one sits, centred vertically on the ramp.
  const logo = el("pre", { class: "caselogo" }, "IYX");
  logo.style.right = W - (R - CASE.logoInset * s) + "px";
  logo.style.top = rampY + (B - rampY - LOGO_INK) / 2 - LOGO_INK_OFFSET + "px";
  $("kbcase").append(logo);
  $("kbcase").style.height = H + "px";
  $("kbcase").style.marginTop = -T + 6 + "px";
  $("kbfoot").style.marginTop = B - H + 12 + "px";

  for (const k of KEYS) {
    k.el = el("div", { class: "key", tabindex: -1,
      style: `left:calc(${k.x} * var(--u));top:calc(${k.y} * var(--u));width:calc(${k.w} * var(--u) + 1px);height:calc(var(--u) + 1px);--kx:${k.x}`,
      on: { click: () => keyClicked(k.id), focus: () => { S.kbFocus = k.id; } } },
      el("div", { class: "tint" }), el("div", { class: "fill" }), el("div", { class: "k-l" }, k.label), el("div", { class: "k-v" }, ""));
    $("kb").append(k.el);
  }
}

function keyClicked(id) {
  if (!S.dev || !S.model) return;
  if (S.tab === "adv" && S.editAdv && S.editAdv.key == null) {
    if (id === FN_KEY) { status("st.fnNoAdv"); return; }
    const existing = S.model.adv.find((a) => a.key === id && a.type === S.editAdv.type);
    S.editAdv.key = id;
    S.editAdv.draft = existing ? clone(existing) : newAdv(S.editAdv.type, id);
    render();
    return;
  }
  if (S.tab === "light" && S.model.light.mode === MODE_CUSTOM) {
    const c = S.model.light.custom;
    if (c[id] === S.paint) delete c[id]; else c[id] = S.paint;
    changed("light");
    return;
  }
  if (S.tab === "map") {
    if (id === FN_KEY || (S.layer === "fn" && FN_LOCKED.has(id))) { status("st.reserved"); return; }
    if (S.layer === "base" && S.model.adv.some((a) => a.key === id)) { status("st.hasAdv"); return; }
  }
  if (["act", "rt", "map"].includes(S.tab)) {
    if (S.selecting.has(id)) S.selecting.delete(id); else S.selecting.add(id);
    render();
  }
}

function renderKeyboard() {
  const m = S.model;
  for (const k of KEYS) {
    let text = "", custom = false, off = !S.dev, tint = "";
    if (S.dev && m) {
      const e = effective(k.id);
      const adv = m.adv.find((a) => a.key === k.id);
      if (S.tab === "rt") {
        const short = (v) => (v / 10).toFixed(1).replace(/^0/, "");
        text = !e.rt ? t("off") : e.p === e.r ? (e.p / 10).toFixed(2) : `${short(e.p)}/${short(e.r)}`;
        custom = m.rt.sets.some((s) => s.keys.includes(k.id));
      } else if (S.tab === "map") {
        const locked = k.id === FN_KEY || (S.layer === "fn" && FN_LOCKED.has(k.id));
        off = locked;
        if (!locked) {
          const code = mappedCode(k.id);
          const remapped = m.map[S.layer][k.id] != null;
          const fnDefault = S.layer === "fn" && DEFAULT_FN[k.id] != null;
          text = adv && S.layer === "base" ? ADV_SHORT[adv.type] : remapped || fnDefault ? (code ? hidLabel(code) : "NONE") : "";
          custom = remapped || (adv && S.layer === "base");
        }
      } else if (S.tab === "light") {
        if (m.light.mode === MODE_CUSTOM) tint = m.light.custom[k.id] || "";
      } else if (S.tab === "adv") {
        text = adv ? ADV_SHORT[adv.type] : "";
        custom = !!adv;
      } else if (S.tab === "act") {
        text = (e.press / 10).toFixed(2);
        custom = m.act.sets.some((s) => s.keys.includes(k.id));
      }
    }
    k.el.querySelector(".k-v").textContent = text;
    k.el.querySelector(".tint").style.background = tint;
    k.el.classList.toggle("custom", custom);
    k.el.classList.toggle("sel", S.selecting.has(k.id));
    k.el.classList.toggle("off", off);
    k.el.classList.toggle("done", !!S.calib?.done.has(k.id));
  }
  renderPrompt();
}

function kbAction(label, onClick, { solid = false, dim = false, help } = {}) {
  return nav(el("button", { class: (solid ? "btn solid" : "") + (dim ? " dim" : ""), help, on: { click: onClick } }, label), { activate: onClick });
}

function renderPrompt() {
  const acts = $("kbActs");
  acts.replaceChildren();
  const n = S.selecting.size;
  const clearSel = () => { S.selecting.clear(); render(); };
  let text = S.dev ? "" : t("kb.none");
  if (S.dev && !S.model) {
    text = t("kb.reading");
  } else if (S.dev && (S.tab === "act" || S.tab === "rt")) {
    if (n) {
      text = t("kb.selected", { n });
      acts.append(kbAction(t("kb.addKeyset"), addKeyset, { solid: true }), kbAction(t("adv.cancelEsc"), clearSel));
    } else {
      text = t("keyset.hint");
      acts.append(kbAction(t("kb.resetKeysets"), () => { if (S.tab === "act") S.model.act.sets = []; else S.model.rt.sets = []; changed("act"); },
        { dim: true, help: t("h.kb.resetKeysets") }));
    }
  } else if (S.dev && S.tab === "map") {
    text = n ? t("kb.nSel", { n }) : t("kb.selKey");
    if (n) acts.append(kbAction(t("adv.cancelEsc"), clearSel));
    acts.append(kbAction(t("kb.resetLayer"), () => { S.model.map[S.layer] = {}; S.selecting.clear(); changed("keys"); }, { dim: true, help: t("h.kb.resetLayer") }));
  } else if (S.dev && S.tab === "light") {
    text = S.model.light.mode === MODE_CUSTOM ? t("light.paintHint") : t("light.onboard");
  } else if (S.dev && S.tab === "switch") {
    text = S.calib ? t("sw.pressPrompt") : t("sw.prompt");
  } else if (S.dev && S.tab === "adv") {
    if (S.editAdv && S.editAdv.key == null) text = t("adv.source", { t: ADV_SHORT[S.editAdv.type] });
    else if (S.editAdv) text = t("adv.editing", { t: ADV_SHORT[S.editAdv.type], k: KEY_BY_ID.get(S.editAdv.key).label });
    acts.append(kbAction(t("adv.resetAll"), () => { S.model.adv = []; S.editAdv = null; changed("keys"); }, { dim: true, help: t("h.adv.resetAll") }));
  }
  $("prompt").textContent = text;
}

function addKeyset() {
  const ids = [...S.selecting];
  if (!ids.length) return;
  const m = S.model;
  if (S.tab === "act") {
    const start = effective(ids[0]).press;
    m.act.sets = removeKeysFrom(m.act.sets, ids);
    m.act.sets.push({ keys: ids, v: start });
  } else {
    const e = effective(ids[0]);
    m.rt.sets = removeKeysFrom(m.rt.sets, ids);
    m.rt.sets.push({ keys: ids, on: true, p: e.p, r: e.r });
  }
  S.selecting.clear();
  changed("act");
}

async function switchProfile(d) {
  if (!S.dev || S.calib) return;
  persistModel();
  PROFILES.cur = (PROFILES.cur + d + PROFILES.list.length) % PROFILES.list.length;
  if (!PROFILES.list[PROFILES.cur]) PROFILES.list[PROFILES.cur] = clone(S.model);
  S.model = { ...defaultModel(), ...clone(PROFILES.list[PROFILES.cur]) };
  saveProfiles(PROFILES);
  status("st.profile", { n: PROFILES.cur + 1 });
  changed("act", "keys", "light");
}

function onTravel(id, depth) {
  const k = KEY_BY_ID.get(id);
  if (!k || !S.live) return;
  k.el.querySelector(".fill").style.height = Math.min(100, depth / 40 * 100) + "%";
  k.el.classList.toggle("hit", !!S.model && depth >= effective(id).press);
}
function clearDepth() {
  for (const k of KEYS) { k.el.querySelector(".fill").style.height = "0"; k.el.classList.remove("hit"); }
}

/* ===================== footer, language, help ===================== */
function renderStatic() {
  document.documentElement.lang = LANG;
  $("hdrVersion").textContent = "IYX_TERMINAL V0.5.0 - IYX 2026";
  $("hdrHint").textContent = t("hdr.hint");
  $("kbfoot").textContent = t("kb.foot");
  $("helpTitle").textContent = t("foot.help");
  $("helpToggle").dataset.help = t("h.help");
  $("offline").textContent = t("foot.offline");
  if (!$("helpBody").dataset.set) $("helpBody").textContent = t("foot.helpDefault");
  const langs = $("langs");
  langs.replaceChildren();
  LANGS.forEach(([code, label], i) => {
    const pick = () => setLang(code);
    langs.append(nav(el("button", { class: LANG === code ? "on" : "", help: t("h.lang"), on: { click: pick } }, label), {
      activate: pick, step: (d) => langs.children[clamp(i + d, 0, LANGS.length - 1)]?.focus() }));
  });
  status(...S.status);
}
function setLang(code) {
  LANG = code;
  try { localStorage.setItem("iyx68.lang", code); } catch {}
  $("helpBody").dataset.set = "";
  renderStatic();
  render();
}

function showHelp(target) {
  const h = target?.closest?.("[data-help]")?.dataset.help;
  if (!h) return;
  const [title, text] = h.split("|");
  $("helpBody").dataset.set = "1";
  $("helpBody").replaceChildren(el("b", {}, title), text || "");
}
document.addEventListener("mouseover", (e) => showHelp(e.target));
document.addEventListener("focusin", (e) => showHelp(e.target));
function toggleHelp() {
  $("help").classList.toggle("closed");
  $("helpCaret").textContent = $("help").classList.contains("closed") ? "^" : "v";
}
$("helpToggle").addEventListener("click", toggleHelp);
nav($("helpToggle"), { activate: toggleHelp });

// Panels are rebuilt on every change, so keyboard focus is restored by position.
function render() {
  const navs = [...document.querySelectorAll("#app .nav")];
  const focused = navs.indexOf(document.activeElement);
  renderDevices();
  renderTabs();
  renderView();
  renderKeyboard();
  syncKeyboardVisibility();
  if (focused >= 0) {
    const now = [...document.querySelectorAll("#app .nav")];
    now[Math.min(focused, now.length - 1)]?.focus({ preventScroll: true });
  }
}

/* ===================== keyboard navigation ===================== */
const menuNavs = () => [...document.querySelectorAll(".nav")].filter((n) => n.offsetParent !== null && !n.closest("#boot"));
function moveKey(from, dx, dy) {
  // spatial move on the keyboard: nearest key whose center lies in the arrow's direction
  const c = (k) => [k.x + k.w / 2, k.y + 0.5];
  const [fx, fy] = c(from);
  let best = null, bestScore = Infinity;
  for (const k of KEYS) {
    if (k === from) continue;
    const [x, y] = c(k);
    const ddx = x - fx, ddy = y - fy;
    if ((dx && Math.sign(ddx) !== dx) || (dy && Math.sign(ddy) !== dy) || (dx && Math.abs(ddy) > 0.5) || (dy && ddy === 0)) continue;
    const score = dx ? Math.abs(ddx) : Math.abs(ddy) * 10 + Math.abs(ddx);
    if (score < bestScore) { best = k; bestScore = score; }
  }
  return best;
}
document.addEventListener("keydown", (e) => {
  const tgt = document.activeElement;
  if (tgt?.tagName === "TEXTAREA" || (tgt?.tagName === "INPUT" && tgt.type !== "color")) {
    if (e.key === "Escape") tgt.blur();
    return;
  }
  const onKey = tgt?.classList?.contains("key");

  if (e.key === "Tab") {  // jump between the menu and the on-screen keyboard
    e.preventDefault();
    if (onKey) (S.lastMenu?.isConnected ? S.lastMenu : menuNavs()[0])?.focus();
    else { S.lastMenu = tgt?.classList?.contains("nav") ? tgt : null; (KEY_BY_ID.get(S.kbFocus) || KEYS[0]).el.focus(); }
    return;
  }
  if (onKey) {
    const k = KEY_BY_ID.get(S.kbFocus);
    const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (dir) { e.preventDefault(); moveKey(k, ...dir)?.el.focus(); return; }
    if (e.key === " " || (e.key === "Enter" && !S.selecting.size)) { e.preventDefault(); keyClicked(k.id); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (S.tab === "act" || S.tab === "rt") addKeyset();
      else if (S.tab === "map") document.querySelector("#view .chip")?.focus();
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); (S.lastMenu?.isConnected ? S.lastMenu : menuNavs()[0])?.focus(); return; }
    return;
  }

  if (e.key === "Escape") {
    if (S.selecting.size) S.selecting.clear();
    else if (S.editAdv?.pickSlot != null) { S.editAdv.pickSlot = null; S.pickFor = null; }
    else if (S.editAdv) { S.editAdv = null; S.pickFor = null; }
    else if (S.confirmReset) S.confirmReset = false;
    render();
    return;
  }
  if (e.key === "Enter" && S.selecting.size && (S.tab === "act" || S.tab === "rt") && !tgt?.classList?.contains("nav")) {
    addKeyset(); e.preventDefault(); return;
  }
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    const all = menuNavs();
    if (!all.length) return;
    e.preventDefault();
    const i = all.indexOf(tgt);
    // skip the other members of a horizontal group so up/down moves between lines
    const rowOf = (n) => n.closest(".tabs, .subtabs, .langs, .line, .chipbox, #kbActs") || n;
    let j = i;
    do { j = e.key === "ArrowDown" ? (j + 1) % all.length : (j - 1 + all.length) % all.length; }
    while (i >= 0 && j !== i && rowOf(all[j]) === rowOf(tgt) && rowOf(tgt) !== tgt);
    (i < 0 ? all[0] : all[j]).focus();
    return;
  }
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && tgt?._step) {
    e.preventDefault();
    tgt._step(e.key === "ArrowRight" ? 1 : -1);
    return;
  }
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && tgt?.classList?.contains("nav")) {
    const group = tgt.parentElement.querySelectorAll(":scope > .nav");
    const i = [...group].indexOf(tgt);
    group[clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, group.length - 1)]?.focus();
    e.preventDefault();
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && tgt?._activate) {
    e.preventDefault();
    tgt._activate();
  }
});

/* ===================== scaling ===================== */
// The page is laid out at a fixed design size and scaled to fill the window.
function fit() {
  const app = $("app");
  const s = Math.max(0.55, Math.min(innerWidth / app.offsetWidth, innerHeight / 900, 2.4));
  app.style.transform = `scale(${s})`;
  document.body.style.height = Math.ceil(app.offsetHeight * s) + "px";
  $("footer").style.transform = `scale(${s})`;
}
addEventListener("resize", fit);

/* ===================== boot ===================== */
function makeGrain() {
  const c = document.createElement("canvas");
  c.width = c.height = 180;
  const g = c.getContext("2d");
  const img = g.createImageData(180, 180);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  $("grain").style.backgroundImage = `url(${c.toDataURL()})`;
}

// Loader: every step is real work; the bar eases toward the work's progress and the whole thing takes at least ~2 s.
async function boot() {
  const bar = $("bootBar");
  for (let i = 0; i < 26; i++) bar.append(el("i", { style: "opacity:0" }));
  let target = 0, shown = 0, stepKey = "boot.init";
  const draw = () => {
    if (!$("boot")) return;  // a frame paused in a background tab can run after the loader is gone
    shown += (target - shown) * 0.12;
    if (target - shown < 0.002) shown = target;
    const filled = Math.round(shown * 26);
    [...bar.children].forEach((b, i) => (b.style.opacity = i < filled ? 1 : 0));
    $("bootStep").textContent = t(stepKey);
    $("bootPct").textContent = t("boot.pct", { n: Math.round(shown * 100) });
    if (!boot.done) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  const phase = async (key, from, to, minMs, work) => {
    stepKey = key;
    const t0 = performance.now();
    await work?.((p) => (target = from + (to - from) * p));
    target = to;
    const left = minMs - (performance.now() - t0);
    if (left > 0) await sleep(left);
  };

  await phase("boot.init", 0, 0.15, 320, async () => { renderStatic(); renderBanner(); buildKeyboard(); render(); });
  await phase("boot.assets", 0.15, 0.38, 380, async () => { makeGrain(); await document.fonts.ready; renderBanner(); });
  await phase("boot.hw", 0.38, 0.58, 380, async () => {
    if ("hid" in navigator) await refreshPaired(); else status("st.noHid");
  });
  await phase("boot.conn", 0.58, 0.97, 520, async (p) => {
    if (S.paired.length === 1) await connect(new Mu68(S.paired[0]), p);
    else status(S.paired.length ? "st.pick" : "hid" in navigator ? "st.pairOrDemo" : "st.noHid");
  });
  await phase("boot.ready", 0.97, 1, 380);
  boot.done = true;
  fit();
  $("boot").classList.add("out");
  document.body.classList.remove("booting");
  setTimeout(() => $("boot").remove(), 400);
  syncKeyboardVisibility();
  await animateBanner();
}

if ("hid" in navigator) {
  navigator.hid.addEventListener("disconnect", async (e) => {
    if (S.dev && S.dev.dev === e.device) {
      S.dev = null;
      S.calib = null;
      status("st.unplugged");
    }
    await refreshPaired();
    render();
  });
  // A paired keyboard that is plugged back in reconnects by itself.
  navigator.hid.addEventListener("connect", async (e) => {
    await refreshPaired();
    if (!S.dev && isMu68(e.device)) await connect(new Mu68(e.device));
    render();
  });
}
boot();

// When hosted (https), cache the app so the installed version opens offline. Opened as a local file, this is skipped.
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
